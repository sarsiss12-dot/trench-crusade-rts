name: Apply Phase 03 upload
on:
  push:
    branches: [main]
    paths:
      - '.phase3_parts/**'
      - '.github/workflows/apply-phase3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 03 patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .phase3_parts ]; then
            echo "No Phase 03 parts present; nothing to do."
            exit 0
          fi
          cat .phase3_parts/part_* > /tmp/phase3.b64
          base64 -d /tmp/phase3.b64 > /tmp/phase3.patch.gz
          gzip -dc /tmp/phase3.patch.gz > /tmp/phase3.patch
          git apply --index /tmp/phase3.patch
          rm -rf .phase3_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: Phase 03 living front, asymmetric economy and pestilence"
          git push
