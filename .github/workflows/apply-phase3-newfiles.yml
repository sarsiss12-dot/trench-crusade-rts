name: Apply Phase 03 new files
on:
  push:
    branches: [main]
    paths:
      - '.phase3_newparts/**'
      - '.github/workflows/apply-phase3-newfiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Phase 03 new files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .phase3_newparts ]; then
            echo "No parts present; nothing to do."
            exit 0
          fi
          cat .phase3_newparts/part_* > /tmp/p3new.b64
          base64 -d /tmp/p3new.b64 > /tmp/p3new.patch.gz
          gzip -dc /tmp/p3new.patch.gz > /tmp/p3new.patch
          git apply --index /tmp/p3new.patch
          rm -rf .phase3_newparts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Phase 03 living-world modules"
          git push
